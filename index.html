<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Malla curricular interactiva de Ingeniería Civil en Informática, Universidad de Los Lagos, sede Chiloé." />
    <meta name="theme-color" content="#123540" />
    <script>
      // Aplica el modo oscuro antes de pintar la página, para evitar un destello claro
      try {
        var t = localStorage.getItem('icinf:tema')
        if (t === 'oscuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <title>Malla interactiva ICINF - ULagos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
